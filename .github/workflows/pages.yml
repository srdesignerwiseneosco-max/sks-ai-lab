name: Publish site (sync main -> gh-pages)

# GitHub Pages serves this site from the gh-pages branch.
# Every push to main is mirrored to gh-pages, which republishes the site.
# Binary assets stored as base64 text (*.b64) are decoded before publishing.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decode base64 assets
        run: |
          shopt -s nullglob
          for f in *.b64; do base64 -d "$f" > "${f%.b64}"; done
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Build: decode binary assets for Pages"
      - name: Push to gh-pages
        run: git push --force origin HEAD:gh-pages
